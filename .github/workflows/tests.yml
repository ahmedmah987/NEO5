name: tests

on:
  pull_request:
    paths:
      - "unsolved/**"
      - "tests/**"
      - "problems/**"
  push:
    branches: [main]
    paths:
      - "unsolved/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
